<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087ea4">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>

<title>Chromosome Quiz</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">

</head>


<body>

<div class="container">

    <div class="logo">
        🧬
    </div>

    <h1>
        Chromosome Quiz
    </h1>

    <p class="subtitle">
        เกมตอบคำถามความรู้เรื่องโครโมโซม
    </p>


    <div class="card">
<p id="status">
⏳ รอหัวหน้าห้องเริ่มการแข่งขัน...
</p>
        <h2>
            🎮 เริ่มเกม
        </h2>

        <p>
            กรอกชื่อของคุณเพื่อเริ่มเล่น
        </p>

        <input
        type="text"
        id="name"
        placeholder="กรอกชื่อของคุณ"
        maxlength="30">

        <button
id="startBtn"
onclick="startGame()"
disabled>

เริ่มเกม 🚀

</button>

        <a href="ranking.html"
        class="ranking-button">

            🏆 ดูอันดับคะแนน

        </a>

    </div>

</div>


<script>

function startGame(){

    var name =
        document.getElementById("name").value;

    name = name.trim();


    if(name == ""){

        alert("กรุณากรอกชื่อก่อนเริ่มเกม");

        return;

    }


    localStorage.removeItem("savedScore");

    localStorage.setItem(
        "playerName",
        name
    );


    window.location.href =
        "quiz.html";

}


/* ตรวจสอบสถานะการแข่งขันแบบ Real-time */

db.collection("settings")
.doc("game")
.onSnapshot(function(doc){

    if(!doc.exists){

        console.log(
            "ไม่พบ settings/game"
        );

        document.getElementById(
            "status"
        ).innerHTML =
        "❌ ไม่พบการตั้งค่าการแข่งขัน";

        return;

    }


    var data =
        doc.data();


    var started =
        data.started;


    console.log(
        "สถานะการแข่งขัน:",
        started
    );


    if(started === true){

        document.getElementById(
            "startBtn"
        ).disabled = false;


        document.getElementById(
            "status"
        ).innerHTML =
        "🚀 เริ่มการแข่งขันแล้ว";


    }else{

        document.getElementById(
            "startBtn"
        ).disabled = true;


        document.getElementById(
            "status"
        ).innerHTML =
        "⏳ รอหัวหน้าห้องเริ่มการแข่งขัน...";

    }


}, function(error){

    console.log(
        "Firebase Error:",
        error
    );


    document.getElementById(
        "status"
    ).innerHTML =
    "❌ ไม่สามารถเชื่อมต่อ Firebase ได้";

});

</script>

</body>

</html>
