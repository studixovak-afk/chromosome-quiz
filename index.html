<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#6c5ce7">

<title>Trivia Battle 🎮</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>


<style>

/* =========================================
   TRIVIA HOME
========================================= */

body{
    margin:0;
    min-height:100vh;

    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #a29bfe 0%,
            #6c5ce7 35%,
            #4834d4 70%,
            #2d1b69 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}


/* =========================================
   พื้นหลังตกแต่ง
========================================= */

body::before{
    content:"";

    position:fixed;

    width:260px;
    height:260px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-80px;
    left:-80px;

    pointer-events:none;
}


body::after{
    content:"";

    position:fixed;

    width:350px;
    height:350px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    bottom:-150px;
    right:-120px;

    pointer-events:none;
}


/* =========================================
   Container
========================================= */

.container{
    width:100%;
    max-width:520px;

    padding:25px 18px;

    box-sizing:border-box;

    position:relative;
    z-index:2;
}


/* =========================================
   Logo
========================================= */

.logo{
    width:105px;
    height:105px;

    margin:0 auto 18px;

    border-radius:30px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:55px;

    background:
        rgba(255,255,255,0.18);

    border:
        1px solid
        rgba(255,255,255,0.25);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.20);

    backdrop-filter:blur(10px);

    animation:
        floatLogo 3s ease-in-out infinite;
}


@keyframes floatLogo{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* =========================================
   Title
========================================= */

h1{

    text-align:center;

    color:white;

    font-size:42px;

    margin:
        0 0 8px;

    font-weight:800;

    letter-spacing:-1px;

    text-shadow:
        0 4px 12px
        rgba(0,0,0,0.20);

}


.subtitle{

    text-align:center;

    color:
        rgba(255,255,255,0.85);

    font-size:16px;

    margin:
        0 0 25px;

}


/* =========================================
   Card
========================================= */

.card{

    background:
        rgba(255,255,255,0.96);

    border-radius:26px;

    padding:30px 25px;

    box-shadow:
        0 25px 60px
        rgba(20,10,70,0.30);

    border:
        1px solid
        rgba(255,255,255,0.7);

}


/* =========================================
   Status
========================================= */

#status{

    padding:
        13px 15px;

    border-radius:14px;

    background:#f3f1ff;

    color:#5b4bc4;

    font-weight:600;

    font-size:14px;

    text-align:center;

    margin-top:0;

}


/* =========================================
   Heading
========================================= */

.card h2{

    text-align:center;

    font-size:25px;

    color:#2d3436;

    margin:
        22px 0 5px;

}


.card p:not(#status){

    text-align:center;

    color:#636e72;

}


/* =========================================
   Input
========================================= */

#name{

    width:100%;

    box-sizing:border-box;

    padding:
        16px 18px;

    border:
        2px solid
        #e8e5ff;

    border-radius:15px;

    outline:none;

    font-size:16px;

    background:#faf9ff;

    transition:
        0.2s ease;

}


#name:focus{

    border-color:#6c5ce7;

    background:white;

    box-shadow:
        0 0 0 4px
        rgba(108,92,231,0.12);

}


/* =========================================
   Main Button
========================================= */

#joinBtn{

    width:100%;

    margin-top:15px;

    padding:
        16px 20px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #6c5ce7,
            #8e7cff
        );

    color:white;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 22px
        rgba(108,92,231,0.30);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;

}


#joinBtn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 14px 28px
        rgba(108,92,231,0.38);

}


#joinBtn:active{

    transform:
        translateY(1px);

}


#joinBtn:disabled{

    opacity:0.65;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;

}


/* =========================================
   Ranking Button
========================================= */

.ranking-button{

    display:block;

    width:100%;

    box-sizing:border-box;

    margin-top:14px;

    padding:
        14px 18px;

    border-radius:15px;

    background:#f1efff;

    color:#5b4bc4;

    text-decoration:none;

    text-align:center;

    font-weight:700;

    transition:
        0.2s ease;

}


.ranking-button:hover{

    background:#e5e1ff;

    transform:
        translateY(-1px);

}


/* =========================================
   Mobile
========================================= */

@media(max-width:500px){

    .container{
        padding:
            20px 14px;
    }


    .logo{

        width:85px;
        height:85px;

        font-size:45px;

        border-radius:25px;

    }


    h1{

        font-size:34px;

    }


    .subtitle{

        font-size:14px;

    }


    .card{

        padding:
            25px 18px;

        border-radius:22px;

    }

}


/* =========================================
   Animation
========================================= */

.card{

    animation:
        cardAppear 0.5s ease;

}


@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(0.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">
        🧠
    </div>


    <!-- =========================
         TITLE
    ========================== -->

    <h1>
        Trivia Battle 🎮
    </h1>


    <p class="subtitle">
        เกมตอบคำถามสุดปั่น<br>
        วัดความรู้ ใครจะได้คะแนนสูงสุด? 🏆
    </p>


    <!-- =========================
         CARD
    ========================== -->

    <div class="card">


        <!-- สถานะ -->

        <p id="status">

            ⏳ กำลังตรวจสอบสถานะห้อง...

        </p>


        <h2>
            🎮 เข้าร่วมเกม
        </h2>


        <p>
            ใส่ชื่อของคุณเพื่อเข้าสู่สนามแข่งขัน
        </p>


        <!-- ชื่อ -->

        <input
        type="text"
        id="name"
        placeholder="✏️ พิมพ์ชื่อของคุณ..."
        maxlength="30"
        autocomplete="off">


        <!-- ปุ่ม -->

        <button
        id="joinBtn"
        onclick="joinRoom()">

            👤 เข้าร่วมเกม

        </button>


        <!-- อันดับ -->

        <a
        href="ranking.html"
        class="ranking-button">

            🏆 ดูอันดับคะแนน

        </a>


    </div>


</div>


<script>

/* =========================================
   ตัวแปร
========================================= */

var participantId =
    localStorage.getItem("participantId");


var playerName =
    localStorage.getItem("playerName");


var gameStarted =
    false;


/* =========================================
   Elements
========================================= */

var nameInput =
    document.getElementById("name");


var joinButton =
    document.getElementById("joinBtn");


var statusElement =
    document.getElementById("status");


/* =========================================
   โหลดชื่อเดิม
========================================= */

if(playerName){

    nameInput.value =
        playerName;

}


/* =========================================
   Firebase Game Status
========================================= */

db.collection("settings")
.doc("game")
.onSnapshot(

    function(doc){

        if(!doc.exists){

            gameStarted =
                false;

            updateButton();

            statusElement.innerHTML =
                "⏳ รอเจ้าของห้องเปิดเกม...";

            return;

        }


        var data =
            doc.data();


        gameStarted =
            data.started === true;


        updateButton();


        if(gameStarted){

            statusElement.innerHTML =
                "🚀 เกมเปิดแล้ว! เข้าร่วมได้เลย";

        }

        else{

            if(participantId){

                statusElement.innerHTML =
                    "🟡 เข้าห้องแล้ว • รอเริ่มเกม";

            }

            else{

                statusElement.innerHTML =
                    "⏳ รอเจ้าของห้องเปิดเกม...";

            }

        }

    },

    function(error){

        console.error(
            "Firebase Game Error:",
            error
        );


        statusElement.innerHTML =
            "❌ ไม่สามารถเชื่อมต่อ Firebase";

    }

);


/* =========================================
   ปรับปุ่ม
========================================= */

function updateButton(){


    if(
        participantId &&
        gameStarted
    ){

        joinButton.innerHTML =
            "🚀 เริ่มเล่นเกม";

        joinButton.disabled =
            false;

        return;

    }


    if(
        participantId &&
        !gameStarted
    ){

        joinButton.innerHTML =
            "🟡 รอเจ้าของห้องเริ่ม";

        joinButton.disabled =
            true;

        return;

    }


    if(
        !participantId &&
        gameStarted
    ){

        joinButton.innerHTML =
            "🚀 เข้าร่วมและเล่นเลย!";

        joinButton.disabled =
            false;

        return;

    }


    joinButton.innerHTML =
        "👤 เข้าร่วมเกม";

    joinButton.disabled =
        false;

}


/* =========================================
   เข้าร่วม / เริ่มเกม
========================================= */

function joinRoom(){


    var name =
        nameInput.value.trim();


    if(name === ""){

        alert(
            "กรุณากรอกชื่อก่อนเข้าร่วมครับ 😊"
        );

        nameInput.focus();

        return;

    }


    localStorage.setItem(
        "playerName",
        name
    );


    /* =====================================
       ผู้เล่นเดิม + เกมเริ่มแล้ว
    ===================================== */

    if(
        participantId &&
        gameStarted
    ){

        joinButton.disabled =
            true;

        joinButton.innerHTML =
            "⏳ กำลังเข้าเกม...";


        db.collection("participants")
        .doc(participantId)
        .set({

            name:name,

            status:"playing",

            startedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        })

        .then(function(){

            window.location.href =
                "quiz.html";

        })

        .catch(function(error){

            console.error(
                error
            );

            updateButton();

            alert(
                "❌ ไม่สามารถเข้าเกมได้\n\n" +
                error.message
            );

        });


        return;

    }


    /* =====================================
       ผู้เล่นเดิม + เกมยังไม่เริ่ม
    ===================================== */

    if(
        participantId &&
        !gameStarted
    ){

        alert(
            "⏳ รอเจ้าของห้องเปิดเกมก่อนนะครับ"
        );

        return;

    }


    /* =====================================
       ผู้เล่นใหม่
    ===================================== */

    var newStatus =
        gameStarted
        ? "playing"
        : "waiting";


    joinButton.disabled =
        true;


    joinButton.innerHTML =
        gameStarted
        ? "⏳ กำลังเข้าเกม..."
        : "⏳ กำลังเข้าร่วม...";


    db.collection("participants")
    .add({

        name:name,

        status:newStatus,

        joinedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp(),

        startedAt:
            gameStarted
            ? firebase.firestore
              .FieldValue
              .serverTimestamp()
            : null

    })


    .then(function(docRef){

        participantId =
            docRef.id;


        localStorage.setItem(
            "participantId",
            participantId
        );


        localStorage.setItem(
            "playerName",
            name
        );


        /* เกมเปิดอยู่ */

        if(gameStarted){

            window.location.href =
                "quiz.html";

            return;

        }


        /* รอเกม */

        statusElement.innerHTML =
            "🟡 เข้าห้องแล้ว! รอเจ้าของห้องเริ่ม";


        joinButton.innerHTML =
            "🟡 รอเริ่มเกม";


        joinButton.disabled =
            true;

    })


    .catch(function(error){

        console.error(
            "Join Room Error:",
            error
        );


        updateButton();


        alert(
            "❌ ไม่สามารถเข้าร่วมเกมได้\n\n" +
            error.message
        );

    });

}


/* =========================================
   ตรวจผู้เล่นเดิม
========================================= */

if(participantId){

    db.collection("participants")
    .doc(participantId)
    .get()

    .then(function(doc){

        if(!doc.exists){

            localStorage.removeItem(
                "participantId"
            );

            participantId =
                null;

            updateButton();

            return;

        }


        var data =
            doc.data();


        if(data.name){

            nameInput.value =
                data.name;

            localStorage.setItem(
                "playerName",
                data.name
            );

        }


        if(
            data.status ===
            "finished"
        ){

            statusElement.innerHTML =
                "✅ คุณเล่นจบแล้ว";


            joinButton.innerHTML =
                "🏆 เล่นจบแล้ว";


            joinButton.disabled =
                true;


            return;

        }


        if(
            data.status ===
            "playing"
        ){

            if(gameStarted){

                joinButton.innerHTML =
                    "🚀 กลับเข้าเกม";

                joinButton.disabled =
                    false;

            }

        }

    })

    .catch(function(error){

        console.error(
            "Participant Load Error:",
            error
        );

    });

}


/* =========================================
   กด Enter
========================================= */

nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            joinRoom();

        }

    }
);


/* =========================================
   เริ่มต้น
========================================= */

updateButton();

</script>


</body>

</html>
