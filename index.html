<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087ea4">

<title>Chromosome Quiz</title>


<link rel="stylesheet"
type="text/css"
href="css/style.css">


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

</head>


<body>


<div class="container">


    <div class="logo">
        🧬
    </div>


    <h1>
        Chromosome Quiz
    </h1>


    <p class="subtitle">
        เกมตอบคำถามความรู้เรื่องโครโมโซม
    </p>



    <div class="card">


        <!-- =========================
             สถานะเกม
        ========================== -->

        <p id="status">

            ⏳ กำลังตรวจสอบสถานะห้อง...

        </p>


        <h2>
            🎮 เข้าร่วมห้อง
        </h2>


        <p>
            กรอกชื่อของคุณ
        </p>


        <input
        type="text"
        id="name"
        placeholder="กรอกชื่อของคุณ"
        maxlength="30"
        autocomplete="off">


        <!-- =========================
             ปุ่มเข้าร่วม / เริ่มเกม
        ========================== -->

        <button
        id="joinBtn"
        onclick="joinRoom()">

            👤 เข้าร่วมห้อง

        </button>


        <br>


        <!-- =========================
             ดูอันดับ
        ========================== -->

        <a href="ranking.html"
        class="ranking-button">

            🏆 ดูอันดับคะแนน

        </a>


    </div>


</div>



<script>


/* =========================================
   ตัวแปร
========================================= */

var participantId =
    localStorage.getItem("participantId");


var playerName =
    localStorage.getItem("playerName");


var gameStarted = false;


/* =========================================
   Elements
========================================= */

var nameInput =
    document.getElementById("name");

var joinButton =
    document.getElementById("joinBtn");

var statusElement =
    document.getElementById("status");


/* =========================================
   แสดงชื่อเดิม ถ้ามี
========================================= */

if(playerName){

    nameInput.value =
        playerName;

}


/* =========================================
   ตรวจสอบสถานะเกม Real-time
========================================= */

db.collection("settings")
.doc("game")
.onSnapshot(

    function(doc){

        /*
           ถ้ายังไม่มี settings/game
        */

        if(!doc.exists){

            gameStarted = false;

            updateButton();

            statusElement.innerHTML =
                "⏳ รอหัวหน้าห้องเริ่มการแข่งขัน...";

            return;

        }


        var data =
            doc.data();


        /*
           อ่านสถานะ started
        */

        gameStarted =
            data.started === true;


        /*
           อัปเดตปุ่ม
        */

        updateButton();


        /*
           แสดงข้อความ
        */

        if(gameStarted){

            statusElement.innerHTML =
                "🚀 การแข่งขันเริ่มแล้ว!";


        }
        else{

            if(participantId){

                statusElement.innerHTML =
                    "🟡 เข้าร่วมห้องแล้ว — รอหัวหน้าห้องเริ่ม";


            }
            else{

                statusElement.innerHTML =
                    "⏳ รอหัวหน้าห้องเริ่มการแข่งขัน...";

            }

        }

    },


    function(error){

        console.error(
            "Firebase Game Error:",
            error
        );


        statusElement.innerHTML =
            "❌ ไม่สามารถเชื่อมต่อ Firebase";


    }

);


/* =========================================
   เปลี่ยนปุ่มตามสถานะ
========================================= */

function updateButton(){

    /*
       มีผู้เล่นอยู่แล้ว
       + เกมเริ่มแล้ว
       = เข้าเกม
    */

    if(
        participantId &&
        gameStarted
    ){

        joinButton.innerHTML =
            "🚀 เริ่มเกม";

        joinButton.disabled =
            false;

        return;

    }


    /*
       มีผู้เล่นอยู่แล้ว
       + เกมยังไม่เริ่ม
       = รอ
    */

    if(
        participantId &&
        !gameStarted
    ){

        joinButton.innerHTML =
            "🟡 รอเริ่มการแข่งขัน";

        joinButton.disabled =
            true;

        return;

    }


    /*
       ยังไม่มี participant
       + เกมเริ่มแล้ว
       = คนที่เพิ่งเข้ามา
    */

    if(
        !participantId &&
        gameStarted
    ){

        joinButton.innerHTML =
            "🚀 เข้าร่วมและเริ่มเกม";

        joinButton.disabled =
            false;

        return;

    }


    /*
       ยังไม่มี participant
       + เกมยังไม่เริ่ม
    */

    joinButton.innerHTML =
        "👤 เข้าร่วมห้อง";

    joinButton.disabled =
        false;

}


/* =========================================
   เข้าร่วมห้อง / เริ่มเกม
========================================= */

function joinRoom(){

    var name =
        nameInput.value.trim();


    /* =====================================
       ตรวจชื่อ
    ===================================== */

    if(name === ""){

        alert(
            "กรุณากรอกชื่อก่อนเข้าร่วม"
        );

        nameInput.focus();

        return;

    }


    /*
       เก็บชื่อไว้ก่อน
    */

    localStorage.setItem(
        "playerName",
        name
    );


    /* =====================================
       กรณีมี participant อยู่แล้ว
       และเกมเริ่มแล้ว
    ===================================== */

    if(
        participantId &&
        gameStarted
    ){

        joinButton.disabled =
            true;


        joinButton.innerHTML =
            "⏳ กำลังเข้าเกม...";


        db.collection("participants")
        .doc(participantId)
        .set({

            name:
                name,

            status:
                "playing",

            startedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        })

        .then(function(){

            window.location.href =
                "quiz.html";

        })

        .catch(function(error){

            console.error(
                "Update Participant Error:",
                error
            );


            joinButton.disabled =
                false;

            updateButton();


            alert(
                "❌ ไม่สามารถเริ่มเกมได้\n\n" +
                error.message
            );

        });


        return;

    }


    /* =====================================
       กรณีมี participant แล้ว
       แต่เกมยังไม่เริ่ม
    ===================================== */

    if(
        participantId &&
        !gameStarted
    ){

        alert(
            "⏳ กรุณารอหัวหน้าห้องเริ่มการแข่งขัน"
        );

        return;

    }


    /* =====================================
       ยังไม่มี participant
       
       สร้างผู้เล่นใหม่
       
       สำคัญ:
       ถ้าเกมเริ่มอยู่แล้ว
       ให้ status = playing
       และเข้าเกมทันที
    ===================================== */

    var newStatus =
        gameStarted
        ? "playing"
        : "waiting";


    joinButton.disabled =
        true;


    joinButton.innerHTML =
        gameStarted
        ? "⏳ กำลังเข้าเกม..."
        : "⏳ กำลังเข้าร่วมห้อง...";


    db.collection("participants")
    .add({

        name:
            name,

        status:
            newStatus,

        joinedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp(),

        startedAt:
            gameStarted
            ? firebase.firestore
              .FieldValue
              .serverTimestamp()
            : null

    })


    .then(function(docRef){

        /*
           เก็บ participant ID
        */

        participantId =
            docRef.id;


        localStorage.setItem(
            "participantId",
            participantId
        );


        localStorage.setItem(
            "playerName",
            name
        );


        /* =================================
           ถ้าเกมเริ่มแล้ว
           เข้า quiz ทันที
        ================================= */

        if(gameStarted){

            window.location.href =
                "quiz.html";

            return;

        }


        /* =================================
           ถ้าเกมยังไม่เริ่ม
        ================================= */

        statusElement.innerHTML =
            "🟡 เข้าร่วมห้องเรียบร้อยแล้ว — รอหัวหน้าห้องเริ่ม";


        joinButton.innerHTML =
            "🟡 รอเริ่มการแข่งขัน";


        joinButton.disabled =
            true;

    })


    .catch(function(error){

        console.error(
            "Join Room Error:",
            error
        );


        joinButton.disabled =
            false;


        updateButton();


        alert(
            "❌ ไม่สามารถเข้าร่วมห้องได้\n\n" +
            error.message
        );

    });

}


/* =========================================
   ตรวจ participant เดิม
========================================= */

if(participantId){

    db.collection("participants")
    .doc(participantId)
    .get()

    .then(function(doc){

        /*
           ถ้า participant หาย
        */

        if(!doc.exists){

            localStorage.removeItem(
                "participantId"
            );

            participantId =
                null;

            updateButton();

            return;

        }


        var data =
            doc.data();


        /*
           โหลดชื่อจาก Firebase
        */

        if(data.name){

            nameInput.value =
                data.name;

            localStorage.setItem(
                "playerName",
                data.name
            );

        }


        /*
           ถ้าทำเสร็จแล้ว
        */

        if(
            data.status ===
            "finished"
        ){

            statusElement.innerHTML =
                "✅ คุณทำแบบทดสอบเสร็จแล้ว";


            joinButton.innerHTML =
                "✅ ทำแบบทดสอบแล้ว";


            joinButton.disabled =
                true;

            return;

        }


        /*
           ถ้ายังเล่นอยู่
        */

        if(
            data.status ===
            "playing"
        ){

            /*
               ถ้าเกมยังเริ่มอยู่
               ให้สามารถกลับเข้าเกมได้
            */

            if(gameStarted){

                joinButton.innerHTML =
                    "🚀 กลับเข้าเกม";

                joinButton.disabled =
                    false;

            }

        }

    })


    .catch(function(error){

        console.error(
            "Participant Load Error:",
            error
        );

    });

}


/* =========================================
   Enter เพื่อเข้าห้อง
========================================= */

nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            joinRoom();

        }

    }
);


/* =========================================
   เริ่มต้น
========================================= */

updateButton();


</script>


</body>

</html>
