<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087ea4">

<title>เจ้าของห้อง - Chromosome Quiz</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

</head>


<body>


<div class="container">


    <div class="card">


        <div class="big-icon">
            👨‍🏫
        </div>


        <h1>
            เจ้าของห้อง
        </h1>


        <p>
            🎓 Chromosome Quiz
        </p>


        <hr>


        <!-- สถานะการแข่งขัน -->

        <p id="status">

            ⏳ กำลังตรวจสอบสถานะ...

        </p>


        <!-- ปุ่มควบคุมเกม -->

        <button
        id="startBtn"
        onclick="startGame()">

            🚀 เริ่มการแข่งขัน

        </button>


        <button
        id="stopBtn"
        onclick="stopGame()"
        style="margin-top:10px;">

            🛑 หยุดการแข่งขัน

        </button>


    </div>


    <!-- =========================
         รายชื่อผู้เล่น
    ========================== -->

    <div class="card"
    style="max-width:800px;">

        <div class="big-icon">
            👥
        </div>


        <h2>
            ผู้เล่นในห้อง
        </h2>


        <p id="playerCount">
            👥 ผู้เล่นทั้งหมด: 0 คน
        </p>


        <div id="connectionStatus">

            ⏳ กำลังโหลดรายชื่อ...

        </div>


        <div style="overflow-x:auto;">


            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            ชื่อ
                        </th>

                        <th>
                            สถานะ
                        </th>

                        <th>
                            คะแนน
                        </th>

                        <th>
                            เวลา
                        </th>

                    </tr>

                </thead>


                <tbody id="participants">

                </tbody>

            </table>


        </div>


    </div>


    <!-- =========================
         ปุ่มต่าง ๆ
    ========================== -->

    <div class="card">


        <a href="ranking.html"
        class="ranking-button">

            🏆 ดูคะแนนผู้เล่น

        </a>


        <a href="answers.html"
        class="ranking-button">

            📖 ดูเฉลย

        </a>


    </div>


</div>



<script src="js/host.js"></script>


</body>

</html>
