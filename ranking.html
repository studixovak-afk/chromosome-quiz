<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087ea4">

<title>Leaderboard</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

</head>


<body>

<div class="container">

    <div class="card ranking-card">

        <div class="big-icon">
            🏆
        </div>


        <h1>
            LEADERBOARD
        </h1>


        <p>
            ตารางคะแนนแบบ Real-time
        </p>


        <div id="online">
            🔴 กำลังเชื่อมต่อ...
        </div>


        <!-- ตารางอันดับ -->

        <table>

            <thead>

                <tr>

                    <th>
                        อันดับ
                    </th>

                    <th>
                        ชื่อ
                    </th>

                    <th>
                        คะแนน
                    </th>

                    <th>
                        เวลา
                    </th>

                </tr>

            </thead>


            <tbody id="ranking">

            </tbody>

        </table>


        <!-- =========================
             รายละเอียดผู้เล่น
        ========================== -->

        <div
        id="playerDetail"
        style="display:none; margin-top:30px;">

            <hr>


            <h2 id="detailName">
                👤 รายละเอียดผู้เล่น
            </h2>


            <p id="detailScore">
                🏆 คะแนน
            </p>


            <div id="answersDetail">

            </div>


            <button
            onclick="closePlayerDetail()"
            style="margin-top:20px;">

                ปิดรายละเอียด

            </button>

        </div>


        <!-- กลับ -->

        <a
        href="index.html"
        class="ranking-button">

            🎮 กลับหน้าแรก

        </a>

    </div>

</div>


<script src="js/ranking.js"></script>


<script>

/* ปิดรายละเอียดผู้เล่น */

function closePlayerDetail(){

    var detail =
        document.getElementById(
            "playerDetail"
        );

    detail.style.display =
        "none";

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

</script>

</body>

</html>
