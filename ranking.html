<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087ea4">

<title>Leaderboard</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

</head>


<body>

<div class="container">

    <div class="card ranking-card">

        <div class="big-icon">
            🏆
        </div>

        <h1>
            LEADERBOARD
        </h1>

        <p>
            ตารางคะแนน
        </p>

        <div id="online">
            ⏳ กำลังโหลด...
        </div>


        <!-- ตารางคะแนน -->

        <table>

            <thead>

                <tr>

                    <th>
                        อันดับ
                    </th>

                    <th>
                        ชื่อ
                    </th>

                    <th>
                        คะแนน
                    </th>

                    <th>
                        เวลา
                    </th>

                </tr>

            </thead>


            <tbody id="ranking">

            </tbody>

        </table>


        <!-- รายละเอียดผู้เล่น -->

        <div id="playerDetail"
        style="display:none; margin-top:30px;">

            <hr>

            <h2 id="detailName">
                รายละเอียด
            </h2>

            <p id="detailScore"></p>

            <div id="answersDetail">

            </div>

        </div>


        <a href="index.html"
        class="ranking-button">

            🎮 กลับหน้าแรก

        </a>

    </div>

</div>


<script src="js/ranking.js"></script>

</body>

</html>
