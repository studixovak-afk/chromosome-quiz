<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#087ea4">

<title>Chromosome Quiz</title>


<link rel="stylesheet"
type="text/css"
href="css/style.css">


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

</head>


<body>


<div class="quiz-container">


    <!-- =========================
         ส่วนด้านบน
    ========================== -->

    <div class="quiz-top">


        <div>

            ผู้เล่น:

            <strong id="playerName"></strong>

        </div>


        <div class="timer">

            ⏱️

            <span id="time">
                00:00
            </span>

        </div>


    </div>



    <!-- =========================
         Progress Bar
    ========================== -->

    <div class="progress">

        <div id="progressBar"></div>

    </div>



    <!-- =========================
         หมายเลขข้อ
    ========================== -->

    <div
    class="question-number"
    id="questionNumber">

        ข้อ 1 / 15

    </div>



    <!-- =========================
         กล่องคำถาม
    ========================== -->

    <div class="question-box">


        <h2 id="question">

            ⏳ กำลังรอหัวหน้าห้องเริ่มการแข่งขัน...

        </h2>


        <div id="answers">

            <p style="text-align:center;">

                เมื่อหัวหน้าห้องกด
                <strong>เริ่มการแข่งขัน</strong>
                เกมจะเริ่มโดยอัตโนมัติ

            </p>

        </div>


    </div>


</div>



<!-- =========================
     JavaScript เกม
========================== -->

<script src="js/questions.js"></script>
<script src="js/quiz.js"></script>


</body>

</html>
