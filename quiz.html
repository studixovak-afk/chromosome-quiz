<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#087ea4">

    <title>Quiz Game</title>


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        type="text/css"
        href="css/style.css">


    <!-- =========================
         Firebase
    ========================== -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase.js"></script>

</head>


<body>


    <!-- =========================
         QUIZ CONTAINER
    ========================== -->

    <div class="quiz-container">


        <!-- =========================
             ส่วนหัว
        ========================== -->

        <div class="quiz-top">


            <!-- ชื่อผู้เล่น -->

            <div class="player-info">

                👤 ผู้เล่น:

                <strong id="playerName">
                    กำลังโหลด...
                </strong>

            </div>


            <!-- เวลา -->

            <div class="timer">

                ⏱️

                <span id="time">
                    00:00
                </span>

            </div>


        </div>



        <!-- =========================
             Progress Bar
        ========================== -->

        <div class="progress">

            <div
                id="progressBar">
            </div>

        </div>



        <!-- =========================
             หมายเลขข้อ
        ========================== -->

        <div
            class="question-number"
            id="questionNumber">

            ข้อ 1 / 15

        </div>



        <!-- =========================
             กล่องคำถาม
        ========================== -->

        <div class="question-box">


            <!-- คำถาม -->

            <h2 id="question">

                ⏳ กำลังโหลดคำถาม...

            </h2>


            <!-- =========================
                 ตัวเลือกคำตอบ
            ========================== -->

            <div id="answers">

                <p
                    style="
                        text-align:center;
                        opacity:0.7;
                    ">

                    ⏳ กำลังเตรียมคำถาม...

                </p>

            </div>


        </div>


    </div>



    <!-- =========================
         โหลดคลังคำถามก่อน
    ========================== -->

    <script src="js/questions.js"></script>


    <!-- =========================
         ระบบเกม
    ========================== -->

    <script src="js/quiz.js"></script>


</body>

</html>
