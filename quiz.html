<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087ea4">

<title>Chromosome Quiz</title>

<link rel="stylesheet"
type="text/css"
href="css/style.css">

</head>


<body>

<div class="quiz-container">


    <div class="quiz-top">

        <div>

            ผู้เล่น:
            <strong id="playerName"></strong>

        </div>


        <div class="timer">

            ⏱️
            <span id="time">
                00:00
            </span>

        </div>

    </div>


    <div class="progress">

        <div id="progressBar"></div>

    </div>


    <div class="question-number"
    id="questionNumber">

        ข้อ 1 / 20

    </div>


    <div class="question-box">

        <h2 id="question">

            คำถาม

        </h2>


        <div id="answers"></div>

    </div>


</div>


<script src="js/quiz.js"></script>

</body>

</html>
